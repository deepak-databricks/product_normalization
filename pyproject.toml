[project]
name = "product_normalization"
version = "0.0.1"
authors = [{ name = "akil.thomas@databricks.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
    "pyyaml",
    "databricks-sdk",
    "databricks-vectorsearch",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
    "ipykernel",
]

[project.optional-dependencies]
app = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "databricks-sql-connector>=0.4.0",
    "python-dotenv>=1.0",
]

[project.scripts]
main = "product_normalization.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/product_normalization"]
# Ship config.yaml inside the wheel so the job reads the same config that was
# deployed, rather than depending on the repo being present on the cluster.
force-include = { "config.yaml" = "product_normalization/config.yaml" }

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
