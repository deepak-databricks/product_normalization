# This is a Databricks asset bundle definition for product_normalization.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: product_normalization
  uuid: bf8f6eab-c4eb-47cc-9d3b-febcc852ea99

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  volume:
    description: Existing UC volume that holds the raw PO CSV
    default: raw_data
  volume_subdir:
    description: Subdirectory inside the volume for this dataset
    default: po
  vector_search_endpoint:
    description: Vector Search endpoint that hosts the index
    default: cfc_ai_search
  embedding_endpoint:
    description: Model serving endpoint used to embed embed_text
    default: databricks-gte-large-en

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-984752964297111.11.azuredatabricks.net
      # Four local profiles match this host; naming one avoids "multiple profiles matched".
      profile: AZURE-SA-WORKSPACE
    variables:
      catalog: users
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://adb-984752964297111.11.azuredatabricks.net
      profile: AZURE-SA-WORKSPACE
      # We explicitly deploy to /Workspace/Users/akil.thomas@databricks.com to make sure we only have a single copy.
      root_path: /Workspace/Users/akil.thomas@databricks.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: users
      schema: prod
    permissions:
      - user_name: akil.thomas@databricks.com
        level: CAN_MANAGE
